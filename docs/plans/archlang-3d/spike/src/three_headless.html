<!doctype html><meta charset="utf-8"><title>three headless probe</title>
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./build/three.module.js","three/addons/":"./jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const q = new URLSearchParams(location.search); const glb = q.get("glb") ?? "laneway.glb", W = 1000, H = 800;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setPixelRatio(1); document.body.append(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace; r.setClearColor(0xe6ebf2);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 1.2)); const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-8, 14, 10); scene.add(sun);
const t0 = performance.now();
const gltf = await new GLTFLoader().loadAsync(glb); gltf.scene.traverse((o) => { if (o.name.startsWith("roof")) o.visible = false; }); scene.add(gltf.scene);
const box = new THREE.Box3().setFromObject(gltf.scene), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), m = Math.max(s.x, s.z) * 0.9;
const cam = new THREE.OrthographicCamera(-m * 1.25, m * 1.25, m, -m, 0.1, 500); cam.position.copy(c).add(new THREE.Vector3(1, 0.9, 1).normalize().multiplyScalar(60)); cam.lookAt(c);
r.render(scene, cam);
const info = r.getContext().getParameter(r.getContext().VERSION) + " | " + (r.getContext().getExtension("WEBGL_debug_renderer_info") ? r.getContext().getParameter(r.getContext().getExtension("WEBGL_debug_renderer_info").UNMASKED_RENDERER_WEBGL) : "n/a");
document.title = "done " + JSON.stringify({ ms: +(performance.now() - t0).toFixed(0), calls: r.info.render.calls, tris: r.info.render.triangles, gl: info });
</script>
